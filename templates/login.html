{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header card-header-ff py-3 px-4">
                <h5 class="mb-0">IT Support Team Login</h5>
                <small class="opacity-75">Authorized Integrated Dairies Limited (IDL) IT personnel only.</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-ff-primary w-100 py-2">Login to Command Center</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
